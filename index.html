<script>
  // Data store
  let currentUser = JSON.parse(localStorage.getItem('nashtech_currentUser') || 'null');
  let clients = JSON.parse(localStorage.getItem('nashtech_clients') || '[]');
  let invoices = JSON.parse(localStorage.getItem('nashtech_invoices') || '[]');
  let users = JSON.parse(localStorage.getItem('nashtech_users') || '[]');
  let settings = JSON.parse(localStorage.getItem('nashtech_settings') || '{}');

  // Ensure default admin always exists with correct credentials
  const adminIndex = users.findIndex(u => u.email === 'admin@nashtech.com');
  const defaultAdmin = {
    name: 'Admin User',
    email: 'admin@nashtech.com',
    password: 'nashtech',
    role: 'admin',
    company: 'Nash Technologies'
  };
  if (adminIndex >= 0) {
    users[adminIndex] = { ...users[adminIndex], ...defaultAdmin };
  } else {
    users.push(defaultAdmin);
  }
  localStorage.setItem('nashtech_users', JSON.stringify(users));

  // Default settings
  if (!settings.companyName) {
    settings = {
      companyName: 'Nash Technologies',
      companyEmail: 'info@nashtech.com',
      companyPhone: '1(876) 359-9983',
      companyAddress: 'Mandeville, Jamaica'
    };
    localStorage.setItem('nashtech_settings', JSON.stringify(settings));
  }

  // Auth
  function showAuthTab(tab) {
    document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    document.getElementById(tab + 'Form').classList.add('active');
    event.target.classList.add('active');
  }

  function ensureAdmin() {
    const idx = users.findIndex(u => u.email === 'admin@nashtech.com');
    const admin = { name: 'Admin User', email: 'admin@nashtech.com', password: 'nashtech', role: 'admin', company: 'Nash Technologies' };
    if (idx >= 0) {
      users[idx] = { ...users[idx], ...admin };
    } else {
      users.push(admin);
    }
    localStorage.setItem('nashtech_users', JSON.stringify(users));
  }

  function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    const password = document.getElementById('loginPassword').value;
    console.log('login attempt', email);
    
    // Try exact match first
    let user = users.find(u => u.email.toLowerCase() === email && u.password === password);
    console.log('login match', user ? 'found' : 'not found');
    
    // If not found and it's admin, force ensure admin exists and retry
    if (!user && email === 'admin@nashtech.com') {
      ensureAdmin();
      user = users.find(u => u.email === 'admin@nashtech.com' && u.password === 'nashtech');
      console.log('admin retry', user ? 'found' : 'not found');
    }
    
    if (!user) {
      alert('Invalid email or password. Try: admin@nashtech.com / nashtech');
      return;
    }
    
    currentUser = user;
    localStorage.setItem('nashtech_currentUser', JSON.stringify(currentUser));
    console.log('login success', currentUser.email);
    enterApp();
  }

  function handleRegister(e) {
    e.preventDefault();
    const user = {
      name: document.getElementById('regName').value,
      email: document.getElementById('regEmail').value,
      phone: document.getElementById('regPhone').value,
      company: document.getElementById('regCompany').value,
      password: document.getElementById('regPassword').value,
      role: document.getElementById('regRole').value
    };
    
    if (users.find(u => u.email === user.email)) {
      alert('Email already registered');
      return;
    }
    
    users.push(user);
    localStorage.setItem('nashtech_users', JSON.stringify(users));
    currentUser = user;
    localStorage.setItem('nashtech_currentUser', JSON.stringify(currentUser));
    enterApp();
  }

  function quickLogin(role) {
    if (role === 'admin') {
      ensureAdmin();
      currentUser = users.find(u => u.email === 'admin@nashtech.com');
      console.log('quickLogin admin', currentUser ? 'found' : 'missing');
      if (currentUser) currentUser._quickLogin = true;
    } else {
      currentUser = {
        name: 'Demo Client',
        email: 'client@example.com',
        role: 'client',
        company: 'Demo Company'
      };
    }
    localStorage.setItem('nashtech_currentUser', JSON.stringify(currentUser));
    console.log('quickLogin enterApp', currentUser ? currentUser.email : 'none');
    enterApp();
  }

  function logout() {
    currentUser = null;
    localStorage.removeItem('nashtech_currentUser');
    location.reload();
  }

  function enterApp() {
    try {
      document.getElementById('authPage').classList.add('hidden');
      document.getElementById('appLayout').classList.add('active');
      document.getElementById('userName').textContent = currentUser.name;
      document.getElementById('userRole').textContent = capitalize(currentUser.role);
      if (typeof updateLoginLogo === 'function') updateLoginLogo();
    } catch(e) {
      console.error('enterApp error:', e);
      alert('App error: ' + e.message);
    }

    // Role-based UI
    const isAdmin = currentUser.role === 'admin';
    document.getElementById('navClients').style.display = isAdmin ? 'flex' : 'none';
    document.getElementById('navCreateInvoice').style.display = isAdmin ? 'flex' : 'none';
    document.getElementById('navSettings').style.display = isAdmin ? 'flex' : 'none';
    document.getElementById('newInvoiceBtn').style.display = isAdmin ? 'inline-flex' : 'none';
    document.getElementById('newInvoiceBtn2').style.display = isAdmin ? 'inline-flex' : 'none';

    // Client portal: only show their invoices
    if (!isAdmin) {
      try {
        document.getElementById('dashboard').querySelector('.stats-grid').innerHTML = `
          <div class="stat-card">
            <div class="stat-label">My Invoices</div>
            <div class="stat-value" id="myInvoiceCount">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total Billed</div>
            <div class="stat-value" id="myTotalBilled">$0</div>
          </div>
        `;
      } catch(e) { console.error('client dashboard error:', e); }
    }

    renderDashboard();
    if (isAdmin) renderClients();
  }

  // Navigation
  function showSection(sectionId) {
    try {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      
      const section = document.getElementById(sectionId);
      if (section) section.classList.add('active');
      
      const navItem = document.querySelector(`.nav-item[data-section="${sectionId}"]`);
      if (navItem) navItem.classList.add('active');
      
      const titles = {
        dashboard: 'Dashboard',
        invoices: 'Invoices',
        clients: 'Clients',
        'create-invoice': 'Create Invoice',
        settings: 'Settings'
      };
      document.getElementById('pageTitle').textContent = titles[sectionId] || 'Dashboard';
      
      if (sectionId === 'create-invoice') populateClientSelect();
      if (sectionId === 'invoices') renderInvoices();
      if (sectionId === 'clients') renderClients();
      if (sectionId === 'users') renderUsers();
      if (sectionId === 'services') renderServices();
      if (sectionId === 'catalog') renderCatalog();
      if (sectionId === 'expenses') renderExpenses();
      if (sectionId === 'estimates') renderEstimates();
      if (sectionId === 'reports') renderReports();
      if (sectionId === 'dashboard') renderDashboard();
    } catch(e) {
      console.error('showSection error:', e);
    }
  }

  // Dashboard
  function renderDashboard() {
    const isAdmin = currentUser.role === 'admin';
    let displayInvoices = invoices;
    
    if (!isAdmin) {
      displayInvoices = invoices.filter(inv => inv.clientEmail === currentUser.email);
      const myCount = displayInvoices.length;
      const myTotal = displayInvoices.reduce((sum, inv) => sum + inv.total, 0);
      const myPaid = displayInvoices.filter(i => i.status === 'paid').length;
      
      document.getElementById('myInvoiceCount').textContent = myCount;
      document.getElementById('myTotalBilled').textContent = '$' + myTotal.toLocaleString();
      
      // Show client invoices table
      const tbody = document.getElementById('recentInvoices');
      const recent = displayInvoices.slice(-5).reverse();
      tbody.innerHTML = recent.map(inv => `
        <tr>
          <td><strong>${inv.number}</strong></td>
          <td>${inv.clientName}</td>
          <td>${inv.date}</td>
          <td>$${inv.total.toLocaleString()}</td>
          <td><span class="badge badge-${getStatusClass(inv.status)}">${capitalize(inv.status)}</span></td>
          <td><button class="btn btn-outline btn-sm" onclick="downloadInvoice('${inv.id}')">Download</button></td>
        </tr>
      `).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--muted)">No invoices yet</td></tr>';
      return;
    }
    
    const total = invoices.reduce((sum, inv) => sum + inv.total, 0);
    const pending = invoices.filter(i => i.status === 'sent').length;
    const paid = invoices.filter(i => i.status === 'paid').length;
    
    document.getElementById('totalRevenue').textContent = '$' + total.toLocaleString();
    document.getElementById('pendingCount').textContent = pending;
    document.getElementById('paidCount').textContent = paid;
    document.getElementById('clientCount').textContent = clients.length;
    
    const tbody = document.getElementById('recentInvoices');
    const recent = invoices.slice(-5).reverse();
    tbody.innerHTML = recent.map(inv => `
      <tr>
        <td><strong>${inv.number}</strong></td>
        <td>${inv.clientName}</td>
        <td>${inv.date}</td>
        <td>$${inv.total.toLocaleString()}</td>
        <td><span class="badge badge-${getStatusClass(inv.status)}">${capitalize(inv.status)}</span></td>
        <td><button class="btn btn-outline btn-sm" onclick="downloadInvoice('${inv.id}')">Download</button></td>
      </tr>
    `).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--muted)">No invoices yet</td></tr>';
  }

  // Invoices
  function renderInvoices() {
    const isAdmin = currentUser.role === 'admin';
    let displayInvoices = invoices;
    if (!isAdmin) {
      displayInvoices = invoices.filter(inv => inv.clientEmail === currentUser.email);
    }
    
    const tbody = document.getElementById('allInvoices');
    tbody.innerHTML = displayInvoices.slice().reverse().map(inv => `
      <tr>
        <td><strong>${inv.number}</strong></td>
        <td>${inv.clientName}</td>
        <td>${inv.date}</td>
        <td>${inv.dueDate}</td>
        <td>$${inv.total.toLocaleString()}</td>
        <td><span class="badge badge-${getStatusClass(inv.status)}">${capitalize(inv.status)}</span></td>
        <td>
          <button class="btn btn-outline btn-sm" onclick="downloadInvoice('${inv.id}')">PDF</button>
          ${isAdmin ? `<button class="btn btn-danger btn-sm" onclick="deleteInvoice('${inv.id}')">Delete</button>` : ''}
        </td>
      </tr>
    `).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--muted)">No invoices yet</td></tr>';
  }

  // Clients
  function renderClients() {
    const tbody = document.getElementById('clientsList');
    tbody.innerHTML = clients.map((client, i) => `
      <tr>
        <td><strong>${client.name}</strong></td>
        <td>${client.email || '-'}</td>
        <td>${client.phone || '-'}</td>
        <td>${client.company || '-'}</td>
        <td>
          <button class="btn btn-outline btn-sm" onclick="deleteClient(${i})">Delete</button>
        </td>
      </tr>
    `).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--muted)">No clients yet</td></tr>';
  }

  // Client modal
  function openClientModal() { document.getElementById('clientModal').classList.add('active'); }
  function closeClientModal() { 
    document.getElementById('clientModal').classList.remove('active');
    document.getElementById('clientForm').reset();
  }

  function saveClient() {
    const client = {
      name: document.getElementById('clientName').value,
      email: document.getElementById('clientEmail').value,
      phone: document.getElementById('clientPhone').value,
      company: document.getElementById('clientCompany').value,
      address: document.getElementById('clientAddress').value
    };
    if (!client.name) return alert('Client name is required');
    clients.push(client);
    localStorage.setItem('nashtech_clients', JSON.stringify(clients));
    closeClientModal();
    renderClients();
    alert('Client added successfully');
  }

  function deleteClient(index) {
    if (confirm('Delete this client?')) {
      clients.splice(index, 1);
      localStorage.setItem('nashtech_clients', JSON.stringify(clients));
      renderClients();
    }
  }

  // Invoice form
  function populateClientSelect() {
    const select = document.getElementById('invClient');
    select.innerHTML = clients.map((c, i) => `<option value="${i}">${c.name}${c.company ? ' - ' + c.company : ''}</option>`).join('');
    if (clients.length === 0) {
      select.innerHTML = '<option value="">No clients - add one first</option>';
    }
  }

  function addLineItem() {
    const container = document.getElementById('lineItems');
    const div = document.createElement('div');
    div.className = 'form-row line-item';
    div.innerHTML = `
      <input type="text" placeholder="Description" class="item-desc">
      <input type="number" placeholder="Qty" class="item-qty" value="1" min="1">
      <input type="number" placeholder="Rate" class="item-rate" step="0.01">
      <button type="button" class="btn btn-outline btn-sm" onclick="removeLineItem(this)">✕</button>
    `;
    container.appendChild(div);
  }

  function removeLineItem(btn) {
    const items = document.querySelectorAll('.line-item');
    if (items.length > 1) btn.closest('.line-item').remove();
  }

  function getLineItems() {
    const items = [];
    document.querySelectorAll('.line-item').forEach(row => {
      const desc = row.querySelector('.item-desc').value.trim();
      const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
      const rate = parseFloat(row.querySelector('.item-rate').value) || 0;
      if (desc && qty > 0 && rate > 0) {
        items.push({ desc, qty, rate, total: qty * rate });
      }
    });
    return items;
  }

  function updateInvoiceTotal() {
    const items = getLineItems();
    const subtotal = items.reduce((sum, i) => sum + i.total, 0);
    const discountType = document.getElementById('invDiscountType').value;
    const discountValue = parseFloat(document.getElementById('invDiscountValue').value) || 0;
    let discount = 0;
    if (discountType === 'percentage') {
      discount = subtotal * (discountValue / 100);
    } else if (discountType === 'fixed') {
      discount = discountValue;
    }
    const invTaxRate = parseFloat(settings.taxRate) || 0;
    const tax = (subtotal - discount) * invTaxRate / 100;
    const total = subtotal - discount + tax;
    
    const totalDisplay = document.getElementById('invoiceTotalDisplay');
    if (totalDisplay) {
      totalDisplay.innerHTML = `
        <p><strong>Subtotal:</strong> $${subtotal.toFixed(2)}</p>
        ${discount > 0 ? `<p><strong>Discount (${discountType === 'percentage' ? discountValue + '%' : '$' + discountValue.toFixed(2)}):</strong> -$${discount.toFixed(2)}</p>` : ''}
        <p><strong>Tax (${invTaxRate}%):</strong> $${tax.toFixed(2)}</p>
        <p style="font-size:1.2rem;font-weight:bold;color:var(--primary)">Total: $${total.toFixed(2)}</p>
      `;
    }
  }

  function saveInvoice() {
    const clientIndex = document.getElementById('invClient').value;
    const client = clients[clientIndex];
    if (!client) return alert('Please add a client first');
    
    const items = getLineItems();
    if (items.length === 0) return alert('Add at least one line item');
    
    const subtotal = items.reduce((sum, i) => sum + i.total, 0);
    const discountType = document.getElementById('invDiscountType').value;
    const discountValue = parseFloat(document.getElementById('invDiscountValue').value) || 0;
    let discount = 0;
    if (discountType === 'percentage') {
      discount = subtotal * (discountValue / 100);
    } else if (discountType === 'fixed') {
      discount = discountValue;
    }
    const invoiceTaxRate = parseFloat(settings.taxRate) || 0;
    const tax = (subtotal - discount) * taxRate / 100;
    const total = subtotal - discount + tax;

    const invoice = {
      id: Date.now().toString(),
      number: (settings.invoicePrefix || 'INV') + '-' + String(invoices.length + 1).padStart(4, '0'),
      clientName: client.name,
      clientEmail: client.email,
      date: document.getElementById('invDate').value,
      dueDate: document.getElementById('invDue').value,
      status: document.getElementById('invStatus').value,
      items: items,
      subtotal: subtotal,
      discountType: discountType,
      discountValue: discountValue,
      discount: discount,
      tax: tax,
      total: total,
      notes: document.getElementById('invNotes').value
    };
    
    invoices.push(invoice);
    localStorage.setItem('nashtech_invoices', JSON.stringify(invoices));
    document.getElementById('invoiceForm').reset();
    showSection('invoices');
    alert('Invoice saved successfully');
  }

  function saveAndDownload() {
    saveInvoice();
    setTimeout(() => {
      const lastInvoice = invoices[invoices.length - 1];
      if (lastInvoice) downloadInvoice(lastInvoice.id);
    }, 100);
  }

  function recordPayment(id) {
    const invoice = invoices.find(i => i.id === id);
    if (!invoice) return;
    const amount = prompt('Record payment for ' + invoice.number + '\nTotal: $' + invoice.total.toFixed(2) + '\nEnter payment amount:');
    if (!amount || isNaN(parseFloat(amount))) return;
    const payment = parseFloat(amount);
    if (payment <= 0 || payment > invoice.total) {
      alert('Invalid payment amount');
      return;
    }
    invoice.paid = (invoice.paid || 0) + payment;
    if (invoice.paid >= invoice.total) {
      invoice.status = 'paid';
    } else {
      invoice.status = 'partial';
    }
    localStorage.setItem('nashtech_invoices', JSON.stringify(invoices));
    renderInvoices();
    renderDashboard();
    alert('Payment of $' + payment.toFixed(2) + ' recorded');
  }

  function deleteInvoice(id) {
    if (confirm('Delete this invoice?')) {
      invoices = invoices.filter(i => i.id !== id);
      localStorage.setItem('nashtech_invoices', JSON.stringify(invoices));
      renderInvoices();
      renderDashboard();
    }
  }

  // PDF Download
  function downloadInvoice(id) {
    const invoice = invoices.find(i => i.id === id);
    if (!invoice) return;
    
    const client = clients.find(c => c.name === invoice.clientName) || {};
    
    const printWindow = window.open('', '_blank');
    printWindow.document.write(`
      <!DOCTYPE html>
      <html>
      <head>
        <title>Invoice ${invoice.number}</title>
        <style>
          body { font-family: Arial, sans-serif; padding: 40px; color: #1e293b; }
          .header { display: flex; justify-content: space-between; margin-bottom: 40px; }
          .company { font-size: 24px; font-weight: bold; color: #2563eb; }
          .invoice-title { font-size: 36px; color: #e2e8f0; text-align: right; }
          .info { display: flex; justify-content: space-between; margin-bottom: 40px; }
          .info-box { width: 45%; }
          .info-box h3 { font-size: 14px; color: #64748b; text-transform: uppercase; margin-bottom: 8px; }
          table { width: 100%; border-collapse: collapse; margin: 30px 0; }
          th { background: #f1f5f9; padding: 12px; text-align: left; font-weight: 600; font-size: 12px; text-transform: uppercase; }
          td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
          .totals { margin-left: auto; width: 300px; }
          .totals table { width: 100%; }
          .totals td { padding: 8px; border: none; }
          .total-row { font-weight: bold; font-size: 18px; border-top: 2px solid #2563eb; }
          .footer { margin-top: 60px; padding-top: 20px; border-top: 1px solid #e2e8f0; text-align: center; color: #64748b; font-size: 12px; }
        </style>
      </head>
      <body>
        <div class="header">
          <div style="display:flex;align-items:center;gap:15px">
            ${settings.invoiceLogo ? `<img src="settings.invoiceLogo" style="height:50px;width:auto">` : ''}
            <div>
              <div class="company">${settings.companyName || 'Nash Technologies'}</div>
              <p>${settings.companyAddress || 'Mandeville, Jamaica'}</p>
              <p>${settings.companyEmail || ''}</p>
              <p>${settings.companyPhone || ''}</p>
              ${settings.companyWebsite ? `<p><a href="${settings.companyWebsite}">${settings.companyWebsite}</a></p>` : ''}
            </div>
          </div>
          <div class="invoice-title">INVOICE</div>
        </div>
        
        <div class="info">
          <div class="info-box">
            <h3>Bill To</h3>
            <p><strong>${client.name || invoice.clientName}</strong></p>
            <p>${client.company || ''}</p>
            <p>${client.email || ''}</p>
            <p>${client.phone || ''}</p>
          </div>
          <div class="info-box" style="text-align: right">
            <p><strong>Invoice #:</strong> ${invoice.number}</p>
            <p><strong>Date:</strong> ${invoice.date}</p>
            <p><strong>Due Date:</strong> ${invoice.dueDate}</p>
            <p><strong>Status:</strong> ${capitalize(invoice.status)}</p>
          </div>
        </div>
        
        <table>
          <thead>
            <tr>
              <th>Description</th>
              <th style="text-align:center">Qty</th>
              <th style="text-align:right">Rate</th>
              <th style="text-align:right">Amount</th>
            </tr>
          </thead>
          <tbody>
            ${invoice.items.map(item => `
              <tr>
                <td>${item.desc}</td>
                <td style="text-align:center">${item.qty}</td>
                <td style="text-align:right">$${item.rate.toFixed(2)}</td>
                <td style="text-align:right">$${item.total.toFixed(2)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        
        <div class="totals">
          <table>
            <tr><td style="text-align:right">Subtotal:</td><td style="text-align:right">$${invoice.subtotal.toFixed(2)}</td></tr>
            ${invoice.discount > 0 ? `<tr><td style="text-align:right">Discount (${invoice.discountType === 'percentage' ? invoice.discountValue + '%' : '$' + invoice.discountValue.toFixed(2)}):</td><td style="text-align:right">-$${invoice.discount.toFixed(2)}</td></tr>` : ''}
            <tr><td style="text-align:right">Tax (${settings.taxRate || 0}%):</td><td style="text-align:right">$${invoice.tax.toFixed(2)}</td></tr>
            <tr class="total-row"><td style="text-align:right">Total:</td><td style="text-align:right">$${invoice.total.toFixed(2)}</td></tr>
          </table>
        </div>
        
        ${invoice.notes ? `<div style="margin-top: 40px; padding: 20px; background: #f8fafc; border-radius: 8px;"><strong>Notes:</strong><p>${invoice.notes}</p></div>` : ''}
        
        <div class="footer">
          <p><strong>Nash Technologies</strong> — Powered by <strong>Microtuff Solutions</strong></p>
          <p>Mandeville, Jamaica | 1(876) 359-9983</p>
        </div>
      </body>
      </html>
    `);
    printWindow.document.close();
    printWindow.print();
  }

  // Settings
  function changePassword(e) {
    e.preventDefault();
    const current = document.getElementById('currentPassword').value;
    const newPass = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;
    
    if (!current || !newPass || !confirm) {
      alert('All fields required');
      return;
    }
    
    if (newPass !== confirm) {
      alert('New passwords do not match');
      return;
    }
    
    if (newPass.length < 6) {
      alert('Password must be at least 6 characters');
      return;
    }
    
    const user = users.find(u => u.id === currentUser.id || u.email === currentUser.email);
    if (!user) {
      alert('User not found');
      return;
    }
    
    if (user.password !== current) {
      alert('Current password is incorrect');
      return;
    }
    
    user.password = newPass;
    localStorage.setItem('nashtech_users', JSON.stringify(users));
    document.getElementById('passwordChangeForm').reset();
    alert('Password updated successfully');
  }

  function saveSettings() {
    settings = {
      companyName: document.getElementById('companyName').value,
      companyEmail: document.getElementById('companyEmail').value,
      companyPhone: document.getElementById('companyPhone').value,

  // Reports
  function renderReports() {
    try {
      const totalRevenue = invoices.filter(i => i.status === 'paid').reduce((sum, i) => sum + (i.total || 0), 0);
      const totalExpenses = expenses.reduce((sum, e) => sum + parseFloat(e.amount || 0), 0);
      const netProfit = totalRevenue - totalExpenses;
      const outstandingEstimates = estimates.filter(e => e.status === 'sent' || e.status === 'draft').length;

      const revEl = document.getElementById('reportRevenue');
      const expEl = document.getElementById('reportExpenses');
      const profEl = document.getElementById('reportProfit');
      const estEl = document.getElementById('reportEstimates');
      const tbody = document.getElementById('reportsTransactions');
      if (revEl) revEl.textContent = '$' + totalRevenue.toLocaleString();
      if (expEl) expEl.textContent = '$' + totalExpenses.toLocaleString();
      if (profEl) {
        profEl.textContent = '$' + netProfit.toLocaleString();
        profEl.style.color = netProfit >= 0 ? '#16a34a' : '#dc2626';
      }
      if (estEl) estEl.textContent = outstandingEstimates;

      const transactions = [];
      invoices.forEach(inv => transactions.push({ type: 'Invoice', date: inv.date, description: inv.number + ' - ' + (inv.clientName || ''), amount: inv.total || 0, status: inv.status }));
      expenses.forEach(exp => transactions.push({ type: 'Expense', date: exp.date, description: exp.category + ' - ' + exp.description, amount: -parseFloat(exp.amount || 0), status: 'paid' }));
      estimates.forEach(est => transactions.push({ type: 'Estimate', date: est.date, description: est.number + ' - ' + est.clientName, amount: est.total || 0, status: est.status }));
      transactions.sort((a, b) => new Date(b.date) - new Date(a.date));
      if (tbody) tbody.innerHTML = transactions.slice(0, 50).map(t => `
        <tr>
          <td>${escapeHtml(t.type)}</td>
          <td>${t.date}</td>
          <td>${escapeHtml(t.description)}</td>
          <td>$${Math.abs(t.amount).toFixed(2)}</td>
          <td><span class="status-badge ${t.status}">${t.status}</span></td>
        </tr>
      `).join('');
    } catch(e) { console.error('renderReports error:', e); }
  }
  function downloadBackup() {
    const backup = {
      version: '1.0',
      exportedAt: new Date().toISOString(),
      company: settings.companyName || 'Nash Technologies',
      data: {
        clients: clients,
        invoices: invoices,
        users: users,
        services: services,
        catalog: catalog,
        expenses: expenses,
        estimates: estimates,
        settings: settings
      }
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `nashtech-backup-${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
    alert('Backup downloaded successfully');
  }

  function importBackup(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const backup = JSON.parse(e.target.result);
        if (!backup.data) throw new Error('Invalid backup file');
        
        if (confirm('This will merge the backup with your current data. Continue?')) {
          if (backup.data.clients) {
            backup.data.clients.forEach(c => {
              if (!clients.find(x => x.email === c.email)) clients.push(c);
            });
          }
          if (backup.data.invoices) {
            backup.data.invoices.forEach(inv => {
              if (!invoices.find(x => x.id === inv.id)) invoices.push(inv);
            });
          }
          if (backup.data.users) {
            backup.data.users.forEach(u => {
              if (!users.find(x => x.email === u.email)) users.push(u);
            });
          }
          if (backup.data.services) services = backup.data.services;
          if (backup.data.catalog) catalog = backup.data.catalog;
          if (backup.data.expenses) expenses = backup.data.expenses;
          if (backup.data.estimates) estimates = backup.data.estimates;
          if (backup.data.settings) {
            settings = { ...settings, ...backup.data.settings };
            loadSettings();
          }
          
          localStorage.setItem('nashtech_clients', JSON.stringify(clients));
          localStorage.setItem('nashtech_invoices', JSON.stringify(invoices));
          localStorage.setItem('nashtech_users', JSON.stringify(users));
          localStorage.setItem('nashtech_services', JSON.stringify(services));
          localStorage.setItem('nashtech_catalog', JSON.stringify(catalog));
          localStorage.setItem('nashtech_expenses', JSON.stringify(expenses));
          localStorage.setItem('nashtech_estimates', JSON.stringify(estimates));
          localStorage.setItem('nashtech_settings', JSON.stringify(settings));
          
          alert('Backup imported successfully');
          location.reload();
        }
      } catch (err) {
        alert('Error importing backup: ' + err.message);
      }
    };
    reader.readAsText(file);
  }

  function exportToCSV(data, filename) {
    if (!data || data.length === 0) {
      alert('No data to export');
      return;
    }
    const headers = Object.keys(data[0]);
    const csv = [
      headers.join(','),
      ...data.map(row => headers.map(h => '"' + (row[h] || '').toString().replace(/"/g, '""') + '"').join(','))
    ].join('\n');
    
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  // Estimate Calculator
  function calculateEstimate() {
    const items = document.querySelectorAll('#estimateItems .estimate-item');
    let subtotal = 0;
    let tax = 0;
    let total = 0;

    items.forEach(item => {
      const qty = parseFloat(item.querySelector('.item-qty').value) || 0;
      const price = parseFloat(item.querySelector('.item-price').value) || 0;
      const itemTotal = qty * price;
      item.querySelector('.item-total').textContent = '$' + itemTotal.toFixed(2);
      subtotal += itemTotal;
    });

    const taxRate = parseFloat(document.getElementById('estimateTaxRate')?.value || 0) || 0;
    tax = subtotal * taxRate / 100;
    total = subtotal + tax;

    document.getElementById('estimateSubtotal').textContent = '$' + subtotal.toFixed(2);
    document.getElementById('estimateTax').textContent = '$' + tax.toFixed(2);
    document.getElementById('estimateTotal').textContent = '$' + total.toFixed(2);

    return { subtotal, tax, total };
  }
